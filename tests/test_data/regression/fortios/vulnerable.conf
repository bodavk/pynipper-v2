#config-version=FGT60F-7.4.6-FW-build0001-240101:opmode=0:vdom=0:user=admin
config system global
set strong-crypto disable
set ssl-static-key-ciphers enable
set dh-params 1024
set admin-ssh-v1 enable
set ssl-min-proto-version TLSv1-1
set ssh-enc-algo aes128-cbc aes256-ctr
set admin-lockout-threshold 8
set admin-lockout-duration 20
set admintimeout 30
end
config system admin
edit admin
set accprofile super_admin
set password ENC regression-secret
next
edit aaa-auditor
set accprofile read_only
set remote-auth enable
set remote-group AAA-Auditors
next
end
config user radius
edit BROKEN-RADSEC
set server radius.example.test
set secret ENC regression-radius-secret
set transport-protocol tls
set server-identity-check disable
set tls-min-proto-version TLSv1-1
next
edit UDP-UNSAFE
set server 192.0.2.21
set secret ENC regression-radius-udp-secret
set transport-protocol udp
set require-message-authenticator disable
next
end
config user group
edit AAA-Auditors
set member BROKEN-RADSEC UDP-UNSAFE
next
end
config system password-policy
set status disable
end
config system interface
edit wan1
set status up
set role wan
set ip 198.51.100.1 255.255.255.0
set allowaccess http ssh snmp fgfm
next
end
config system snmp community
edit public
set status enable
next
end
config system ntp
set ntpsync disable
end
config firewall policy
edit 1
set srcintf any
set dstintf any
set srcaddr all
set dstaddr all
set service ALL
set schedule always
set action accept
next
end
