#config-version=FGT100F-7.2.11-FW-build0001-240101:opmode=0:vdom=1:user=auditor
config system global
    set hostname "variant-fortigate"
    set strong-crypto enable
    set admin-ssh-v1 disable
    set ssl-static-key-ciphers disable
    set dh-params 4096
    set admin-https-ssl-versions "tlsv1-2" "tlsv1-3"
    set admin-lockout-threshold 3
    set admin-lockout-duration 120
    set admintimeout 5
end
config system admin
    edit "audit-admin"
        set accprofile "super_admin"
        set two-factor "fortitoken"
        set trusthost1 192.0.2.10 255.255.255.255
    next
end
config system password-policy
    set status enable
    set minimum-length 14
    set min-lower-case-letter 1
    set min-upper-case-letter 1
    set min-non-alphanumeric 1
    set min-number 1
    set reuse-password disable
end
config system interface
    edit "wan1"
        set role wan
        set allowaccess "http" "https" "ssh"
        unset allowaccess
        set allowaccess "ping" "https" "ssh"
    next
end
config log syslogd setting
    set status enable
    set server "192.0.2.30"
end
config system ntp
    set ntpsync enable
    set type fortiguard
end
config firewall policy
    edit 100
        set name "retired-any-policy"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "all"
        set service "ALL"
        set schedule "always"
        set action accept
        set status disable
    next
end
