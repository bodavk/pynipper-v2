#config-version=FGT100F-7.2.11-FW-build0001-240101:opmode=0:vdom=1:user=admin
config system global
set hostname edge-fw
set strong-crypto enable
set ssl-static-key-ciphers disable
set dh-params 4096
set admin-ssh-v1 disable
set ssh-cbc-cipher disable
set ssh-enc-algo aes256-ctr chacha20-poly1305@openssh.com
set ssh-kex-algo curve25519-sha256
set ssh-mac-algo hmac-sha2-256
set admin-server-cert corp-edge-fw
set admin-lockout-threshold 3
set admin-lockout-duration 120
set admintimeout 5
end
config system admin
edit remote-ops
set accprofile super_admin
set remote-auth enable
set remote-group FortiAdmins
set trusthost1 192.0.2.0 255.255.255.0
next
edit breakglass
set accprofile super_admin
set two-factor fortitoken
set trusthost1 192.0.2.10 255.255.255.255
next
end
config system password-policy
set status enable
set apply-to admin-password
set minimum-length 14
set min-lower-case-letter 1
set min-upper-case-letter 1
set min-non-alphanumeric 1
set min-number 1
set reuse-password disable
end
config system interface
edit wan1
set role wan
set ip 198.51.100.1 255.255.255.0
set allowaccess ping https ssh snmp
next
edit lan
set role lan
set ip 10.0.0.1 255.255.255.0
next
end
config system snmp user
edit monitor
set security-level auth-priv
set auth-proto sha256
set auth-pwd ENC secret-auth
set priv-proto aes256
set priv-pwd ENC secret-priv
next
end
config system ntp
set ntpsync enable
set type fortiguard
end
config log syslogd setting
set status enable
set server 192.0.2.20
end
config log syslogd filter
set anomaly enable
set forward-traffic enable
set local-traffic enable
set system enable
set user enable
end
config system autoupdate schedule
set status enable
set frequency automatic
end
config system fortiguard
set auto-firmware-upgrade enable
end
config firewall policy
edit 1
set srcintf lan
set dstintf wan1
set srcaddr CorpNet
set dstaddr all
set service HTTPS DNS
set action accept
set logtraffic all
set utm-status enable
set ips-sensor default
set ssl-ssh-profile certificate-inspection
next
end
config firewall DoS-policy
edit 1
set interface wan1
config anomaly
edit tcp_syn_flood
set status enable
set log enable
set action block
set threshold 2000
next
end
next
end
