## Model: SRX345
set version 22.4R1.10
set system host-name vulnerable-junos
set system authentication-order [ tacplus password ]
set system tacplus-server 192.0.2.5 secret "$9$redacted"
set system login user admin class super-user
set system services telnet
set system services ssh root-login allow
set system services ssh protocol-version v1
set system services ssh ciphers [ 3des-cbc aes256-ctr ]
set system services web-management https system-generated-certificate
set system services web-management session idle-timeout 60
set snmp community public authorization read-write
set system ntp server 192.0.2.20
set firewall family inet filter EDGE term permit-any from source-address 0.0.0.0/0
set firewall family inet filter EDGE term permit-any then accept
set interfaces ge-0/0/0 unit 0 family inet filter input EDGE
set protocols lldp interface all
set protocols bgp group TRANSIT type external
set protocols bgp group TRANSIT neighbor 192.0.2.10
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0
set security zones security-zone untrust interfaces ge-0/0/0.0
set security zones security-zone untrust screen exposed-screen
set security screen ids-option exposed-screen tcp syn-flood attack-threshold 625
deactivate security screen ids-option exposed-screen tcp syn-flood
set security screen ids-option exposed-screen udp flood threshold 1000
set security screen ids-option exposed-screen icmp flood threshold 1000
deactivate security screen ids-option exposed-screen icmp flood
set security screen ids-option exposed-screen alarm-without-drop
