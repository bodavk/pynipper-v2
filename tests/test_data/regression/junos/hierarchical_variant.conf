## Model: SRX345
version 22.4R1.10;
system {
    host-name variant-srx;
    services {
        inactive: telnet;
        ssh {
            root-login deny;
            ciphers [ aes256-ctr aes256-gcm@openssh.com ];
            macs [ hmac-sha2-256 hmac-sha2-512 ];
            key-exchange [ curve25519-sha256 ecdh-sha2-nistp384 ];
            hostkey-algorithm [ ssh-ed25519 rsa-sha2-512 ];
        }
        web-management {
            https {
                system-generated-certificate;
            }
        }
    }
    authentication-order [ tacplus password ];
    tacplus-server 192.0.2.5 {
        secret "$9$redacted";
    }
    login {
        retry-options {
            tries-before-disconnect 3;
            lockout-period 30;
        }
        user audit {
            class super-user;
            authentication {
                ssh-ed25519 "ssh-ed25519 AAAAredacted";
            }
        }
    }
    syslog {
        host 192.0.2.30 {
            any informational;
        }
    }
    ntp {
        authentication-key 1 {
            type sha256;
            value "$9$key";
        }
        trusted-key 1;
        server 192.0.2.20 {
            key 1;
        }
    }
    no-redirects;
}
interfaces {
    lo0 {
        unit 0 {
            family inet {
                address 192.0.2.1/32;
                filter {
                    input PROTECT-RE;
                }
            }
        }
    }
}
firewall {
    family inet {
        filter PROTECT-RE {
            term allow-ssh {
                from {
                    source-address 192.0.2.0/24;
                    protocol tcp;
                }
                then accept;
            }
            inactive: term retired-any {
                from {
                    source-address 0.0.0.0/0;
                }
                then accept;
            }
            term deny-rest {
                then discard;
            }
        }
    }
}
