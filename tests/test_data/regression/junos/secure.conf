## Model: SRX345
set version 22.4R1.10
set system host-name secure-srx
set system authentication-order [ tacplus password ]
set system tacplus-server 192.0.2.5 secret "$9$redacted"
set system diag-port-authentication encrypted-password "$6$redacted"
set system internet-options icmpv4-rate-limit packet-rate 1000
set system internet-options icmpv6-rate-limit packet-rate 1000
set system internet-options no-source-quench
set system internet-options tcp-drop-synfin-set
set system internet-options no-tcp-reset drop-all-tcp
set system ntp server 192.0.2.20 version 4
set system tacplus-server 192.0.2.5 source-address 192.0.2.1
set system services ssh connection-limit 10
set system services ssh rate-limit 4
set system ports auxiliary disable
set system ports console log-out-on-disconnect
set system syslog file interactive-commands interactive-commands any
set system no-multicast-echo
set system no-ping-record-route
set system no-ping-time-stamp
set system login password minimum-length 12
set system login password change-type character-sets
set system login password minimum-character-changes 4
set system login password minimum-changes 4
set system accounting events [ login change-log interactive-commands ]
set system accounting destination tacplus
set system login message "Authorized use only"
set system login idle-timeout 10
set system login retry-options tries-before-disconnect 3
set system login retry-options lockout-period 30
set system login user ops class super-user
set system login user ops authentication ssh-ed25519 "ssh-ed25519 AAAAredacted"
set system services ssh root-login deny
set system services ssh ciphers [ aes256-ctr aes256-gcm@openssh.com ]
set system services ssh macs [ hmac-sha2-256 hmac-sha2-512 ]
set system services ssh key-exchange [ curve25519-sha256 ecdh-sha2-nistp384 ]
set system services ssh hostkey-algorithm [ ssh-ed25519 rsa-sha2-512 ]
set snmp v3 usm local-engine user monitor authentication-sha authentication-password "$9$auth"
set snmp v3 usm local-engine user monitor privacy-aes128 privacy-password "$9$priv"
set system syslog host 192.0.2.30 any informational
set system ntp authentication-key 1 type sha256 value "$9$key"
set system ntp trusted-key 1
set system ntp server 192.0.2.20 key 1
set system no-redirects
set interfaces lo0 unit 0 family inet address 192.0.2.1/32
set interfaces lo0 unit 0 family inet filter input PROTECT-RE
set firewall family inet filter PROTECT-RE term allow-ssh from source-address 192.0.2.0/24
set firewall family inet filter PROTECT-RE term allow-ssh from protocol tcp
set firewall family inet filter PROTECT-RE term allow-ssh then accept
set firewall family inet filter PROTECT-RE term deny-rest then discard
set protocols bgp group TRANSIT type external
set protocols bgp group TRANSIT authentication-key "$9$redacted"
set protocols bgp group TRANSIT import IMPORT-TRANSIT
set protocols bgp group TRANSIT export EXPORT-TRANSIT
set protocols bgp group TRANSIT family inet unicast prefix-limit maximum 1000
set protocols bgp group TRANSIT neighbor 192.0.2.10
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0 authentication md5 1 key "$9$redacted"
set security zones security-zone untrust interfaces ge-0/0/0.0 host-inbound-traffic system-services ike
set security zones security-zone untrust interfaces ge-0/0/0.0 host-inbound-traffic system-services ping
