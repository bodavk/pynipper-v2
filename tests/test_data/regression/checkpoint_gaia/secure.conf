#
# Configuration of gw-lab-02
# Language version: 15.0v1
#
set hostname gw-lab-02
set net-access telnet off
set inactivity-timeout 10
set message banner on msgvalue "Authorized use only"
set password-controls complexity 3
set password-controls min-password-length 14
set password-controls history-checking on
set password-controls deny-on-fail enable on
set password-controls deny-on-fail failures-allowed 5
set password-controls deny-on-fail allow-after 1200
set snmp agent on
set snmp agent-version v3-Only
add snmp usm user monitor security-level authPriv auth-pass-phrase ExampleAuthPhrase1 privacy-pass-phrase ExamplePrivPhrase1
add user labadmin uid 0 homedir /home/labadmin
set user labadmin shell /etc/cli.sh
set user labadmin password-hash $6$exAmple$0000000000000000000000
