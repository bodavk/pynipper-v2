set hostname gw-lab-01
set net-access telnet on
set inactivity-timeout 60
set message banner off
set password-controls complexity 1
set password-controls min-password-length 6
set password-controls history-checking off
set password-controls deny-on-fail enable off
set snmp agent on
set snmp agent-version any
add snmp community public read-only
add snmp community lab-rw read-write
add snmp usm user monitor security-level authNoPriv auth-pass-phrase ExampleAuthPhrase1
add user labadmin uid 0 homedir /home/labadmin
set user labadmin shell /bin/bash
set user labadmin password-hash $1$exAmple$0000000000000000000000
