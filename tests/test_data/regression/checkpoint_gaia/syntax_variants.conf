#
# Configuration of gw-lab-03
# Language version: 15.0v1
#
# Later commands replace earlier ones; deleted objects are no longer effective.
set hostname gw-lab-03
set net-access telnet on
set net-access telnet off
set inactivity-timeout 45
set inactivity-timeout 5
set message banner off
set message banner on msgvalue "Authorized use only"
set password-controls deny-on-fail enable off
set password-controls deny-on-fail enable on
set password-controls min-password-length 6
set password-controls min-password-length 12
set snmp agent on
set snmp agent-version any
add snmp community public read-write
delete snmp community public
add snmp usm user oldmon security-level authNoPriv auth-pass-phrase ExampleAuthPhrase1
delete snmp usm user oldmon
add user tempadmin uid 0 homedir /home/tempadmin
delete user tempadmin
