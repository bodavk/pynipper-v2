version 15.2(4)M7
hostname secure
aaa new-model
aaa authentication login default group tacacs+ local
aaa accounting exec default start-stop group tacacs+
username admin privilege 15 algorithm-type scrypt secret REDACTED
enable algorithm-type scrypt secret REDACTED
no ip http server
ip ssh version 2
ip ssh authentication-retries 3
ip ssh time-out 60
no ip source-route
logging host 192.0.2.50
logging trap informational
ntp authenticate
ntp authentication-key 1 md5 REDACTED
ntp trusted-key 1
ntp server 192.0.2.123 key 1
banner login ^Authorized access only^
snmp-server group SECURE v3 priv
interface GigabitEthernet0/0
 ip address 198.51.100.1 255.255.255.0
 no ip redirects
 no ip proxy-arp
 no shutdown
control-plane
 service-policy input COPP
line con 0
 exec-timeout 5 0
 login local
line vty 0 4
 exec-timeout 5 0
 login authentication default
 transport input ssh
 access-class MGMT in
crypto isakmp policy 10
 encryption aes 256
 hash sha256
 group 19
crypto ipsec transform-set STRONG esp-aes 256 esp-sha256-hmac
