version 15.2(4)M7
hostname secure
login block-for 120 attempts 3 within 60
login on-success log
login on-failure log
banner exec ^Authorized use only^
ip domain name example.test
logging buffered 64000
logging console critical
service timestamps debug datetime msec localtime show-timezone
logging source-interface Loopback0
ip tacacs source-interface Loopback0
ntp source Loopback0
aaa authentication enable default group tacacs+ enable
aaa accounting network default start-stop group tacacs+
aaa accounting system default start-stop group tacacs+
snmp-server enable traps snmp authentication
snmp-server host 192.0.2.60 version 3 priv SNMPUSER
aaa new-model
aaa authentication login default group tacacs+ local
aaa authorization exec default group tacacs+ local
aaa authorization commands 15 default group tacacs+ local
aaa accounting exec default start-stop group tacacs+
username admin privilege 15 algorithm-type scrypt secret REDACTED
enable algorithm-type scrypt secret REDACTED
no ip http server
ip ssh version 2
ip ssh authentication-retries 3
ip ssh time-out 60
no ip source-route
no service pad
no ip bootp server
no ip domain lookup
service tcp-keepalives-in
logging host 192.0.2.50 transport beep tls cipher 128 trustpoint LOG-TP
logging trap informational
archive
 log config
  logging enable
  hidekeys
  notify syslog
ntp authenticate
ntp authentication-key 1 md5 REDACTED
ntp trusted-key 1
ntp server 192.0.2.123 key 1
banner login ^Authorized access only^
snmp-server group SECURE v3 priv
interface GigabitEthernet0/0
 ip address 198.51.100.1 255.255.255.0
 no cdp enable
 no ip redirects
 no ip proxy-arp
 no mop enabled
 no shutdown
ip access-list extended COPP-MGMT
 permit tcp 192.0.2.0 0.0.0.255 any eq 22
class-map match-any COPP-MGMT
 match access-group name COPP-MGMT
policy-map COPP
 class COPP-MGMT
  police 128000 conform-action transmit exceed-action drop
 class class-default
  police 64000 conform-action transmit exceed-action drop
control-plane
 service-policy input COPP
line con 0
 exec-timeout 5 0
 login local
line aux 0
 no exec
 exec-timeout 0 1
 no password
 transport input none
 transport output none
line vty 0 4
 exec-timeout 5 0
 login authentication default
 transport input ssh
 access-class MGMT in
crypto isakmp policy 10
 encryption aes 256
 hash sha256
 group 19
crypto ipsec transform-set STRONG esp-aes 256 esp-sha256-hmac
router bgp 65000
 neighbor 192.0.2.10 remote-as 65100
 neighbor 192.0.2.10 password REDACTED
 neighbor 192.0.2.10 route-map IMPORT in
 neighbor 192.0.2.10 route-map EXPORT out
 neighbor 192.0.2.10 maximum-prefix 1000
route-map IMPORT permit 10
 match ip address prefix-list IMPORT-PREFIXES
route-map EXPORT permit 10
 match ip address prefix-list EXPORT-PREFIXES
ip prefix-list IMPORT-PREFIXES permit 198.51.100.0/24
ip prefix-list EXPORT-PREFIXES permit 203.0.113.0/24
router ospf 1
 area 0 authentication message-digest
interface GigabitEthernet0/1
 ip ospf 1 area 0
 ip ospf message-digest-key 1 md5 REDACTED
ntp access-group peer 10
