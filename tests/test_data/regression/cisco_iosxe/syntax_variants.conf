version 17.9
hostname variant-xe
aaa new-model
aaa authentication login default group tacacs+ local
aaa accounting exec default start-stop group tacacs+
username admin privilege 15 algorithm-type scrypt secret REDACTED
enable algorithm-type scrypt secret REDACTED
no ip http server
ip ssh version 2
ip ssh authentication-retries 3
ip ssh timeout 60
no ip source-route
logging host 192.0.2.50
logging trap informational
ntp authenticate
ntp authentication-key 1 md5 REDACTED
ntp trusted-key 1
ntp server 192.0.2.123 key 1
banner login ^Authorized access only^
snmp-server group SECURE v3 priv
control-plane
 service-policy input COPP
line vty 0 4
 exec-timeout 5 0
 login authentication default
 transport input ssh
 ipv6 access-class V6-MGMT in
mka policy MKA-SECURE
 macsec-cipher-suite gcm-aes-xpn-256
key chain MKA-KEYS macsec
 key 01
  key-string 7 REDACTED
interface TwentyFiveGigE1/0/1
 switchport trunk allowed vlan 10,20
 mka policy MKA-SECURE
 mka pre-shared-key key-chain MKA-KEYS
 macsec
interface GigabitEthernet1/0/48
 switchport
 shutdown
crypto ikev2 proposal UNUSED-WEAK
 encryption 3des
 integrity sha1
 prf sha1
 group 2
crypto ikev2 proposal ACTIVE-STRONG
 encryption aes-gcm-256
 prf sha384
 group 20
crypto ikev2 policy 10
