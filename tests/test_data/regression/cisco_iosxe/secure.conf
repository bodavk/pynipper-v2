version 17.9
hostname secure-xe
login block-for 120 attempts 3 within 60
login on-success log
login on-failure log
banner exec ^Authorized use only^
ip domain name example.test
logging buffered 64000
logging console critical
service timestamps debug datetime msec localtime show-timezone
logging source-interface Loopback0
ip tacacs source-interface Loopback0
ntp source Loopback0
aaa authentication enable default group tacacs+ enable
aaa accounting network default start-stop group tacacs+
aaa accounting system default start-stop group tacacs+
snmp-server enable traps snmp authentication
snmp-server host 192.0.2.60 version 3 priv SNMPUSER
aaa new-model
aaa authentication login default group tacacs+ local
aaa authorization exec default group tacacs+ local
aaa authorization commands 15 default group tacacs+ local
aaa accounting exec default start-stop group tacacs+
username admin privilege 15 algorithm-type scrypt secret REDACTED
enable algorithm-type scrypt secret REDACTED
no ip http server
ip ssh version 2
ip ssh server algorithm kex ecdh-sha2-nistp256
ip ssh server algorithm mac hmac-sha2-256
ip ssh authentication-retries 3
ip ssh time-out 60
no ip source-route
no service pad
no ip bootp server
no ip domain lookup
service tcp-keepalives-in
logging host 192.0.2.50 transport tls port 6514
logging trap informational
archive
 log config
  logging enable
  hidekeys
  notify syslog
ntp authenticate
ntp authentication-key 1 hmac-sha2-256 REDACTED
ntp trusted-key 1
ntp server 192.0.2.123 key 1
banner login ^Authorized access only^
snmp-server group SECURE v3 priv
ip dhcp snooping
ip dhcp snooping vlan 10
ip arp inspection vlan 10
ip access-list extended COPP-MGMT
 permit tcp 192.0.2.0 0.0.0.255 any eq 22
class-map match-any COPP-MGMT
 match access-group name COPP-MGMT
policy-map COPP
 class COPP-MGMT
  police 128000 conform-action transmit exceed-action drop
 class class-default
  police 64000 conform-action transmit exceed-action drop
control-plane
 service-policy input COPP
line vty 0 4
 exec-timeout 5 0
 login authentication default
 transport input ssh
 access-class MGMT in
mka policy MKA-SECURE
 macsec-cipher-suite gcm-aes-256
key chain MKA-KEYS macsec
 key 1
  key-string 7 REDACTED
interface Port-channel10
 switchport mode trunk
 mka policy MKA-SECURE
 mka pre-shared-key key-chain MKA-KEYS
 macsec network-link
interface GigabitEthernet1
 switchport mode access
 switchport access vlan 10
 ip verify source
 switchport port-security
crypto ikev2 proposal STRONG
 encryption aes-gcm-256
 prf sha384
 group 20
crypto ikev2 policy 10
 proposal STRONG
no vstack
ntp access-group peer 10
