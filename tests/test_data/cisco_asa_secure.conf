ASA Version 9.12(4)
!
hostname asa-secure
!
enable password hashed_or_strong_value
!
interface GigabitEthernet0/0
 nameif outside
 security-level 0
 ip address 192.168.1.1 255.255.255.0
!
interface GigabitEthernet0/1
 nameif inside
 security-level 100
 ip address 10.0.0.1 255.255.255.0
!
object-group network web_servers
 network-object host 10.0.0.10
 network-object host 10.0.0.11
!
access-list outside_access_in extended permit tcp any object-group web_servers eq www
access-group outside_access_in in interface outside
!
no telnet 0.0.0.0 0.0.0.0 outside
ssh 10.0.0.0 255.255.255.0 inside
!
ssl minimum-version tlsv1.2
!
snmp-server community S3cur3_Str1ng
snmp-server host inside 10.0.0.50
!
logging enable
logging host inside 10.0.0.100
!
